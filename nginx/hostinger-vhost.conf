# ── app.kolaykobi.com — KolayKOBİ SaaS ──────────────────────────────────────
# Konumu: /etc/nginx/sites-available/app.kolaykobi.com
# Etkinleştirmek için:
#   sudo ln -s /etc/nginx/sites-available/app.kolaykobi.com \
#              /etc/nginx/sites-enabled/app.kolaykobi.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL için (önce etkinleştirip reload yap, sonra sertifika al):
#   sudo certbot --nginx -d app.kolaykobi.com

server {
    listen 80;
    listen [::]:80;
    server_name app.kolaykobi.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Şimdilik HTTP — certbot bu bloğu HTTPS'e çevirecek
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;  # n8n araçları 60-90s bekleyebilir
        proxy_send_timeout    10s;

        # WebSocket desteği (gelecekte gerekebilir)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

