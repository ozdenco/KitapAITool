services:
  postgres:
    image: postgres:16-alpine
    container_name: kkb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kolaykobi
      POSTGRES_USER: kkbuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kkbpassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    # Port sadece geliştirme için — production'da kaldır
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kkbuser -d kolaykobi"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kkb-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=postgres;Database=kolaykobi;Username=kkbuser;Password=${DB_PASSWORD:-kkbpassword123}"
      Jwt__Secret: ${JWT_SECRET:-supersecretjwtkey_change_in_production_min32chars}
      Jwt__ExpiryMinutes: "60"
      Jwt__RefreshExpiryDays: "30"
      N8n__BaseUrl: ${N8N_BASE_URL:-https://n8n.srv1492396.hstgr.cloud}
      # Google OAuth
      Google__ClientId: ${GOOGLE__CLIENTID:-}
      Google__ClientSecret: ${GOOGLE__CLIENTSECRET:-}
      # SMTP (e-posta doğrulama)
      Smtp__Host: ${SMTP__HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP__PORT:-587}
      Smtp__User: ${SMTP__USER:-}
      Smtp__Password: ${SMTP__PASSWORD:-}
      Smtp__FromEmail: ${SMTP__FROMEMAIL:-}
      Smtp__FromName: ${SMTP__FROMNAME:-KolayKOBİ}
      AppUrl: ${APP_URL:-https://app.kolaykobi.com}
      # Brevo pazarlama listesi (hoş geldin e-posta serisi)
      # NOT: SMTP anahtarından FARKLI bir anahtardır (Brevo → SMTP & API → API Keys)
      Brevo__ApiKey: ${BREVO__APIKEY:-}
      Brevo__WelcomeListId: ${BREVO__WELCOMELISTID:-}
      # PayTR ödeme
      PayTr__MerchantId: ${PAYTR_MERCHANT_ID:-}
      PayTr__MerchantKey: ${PAYTR_MERCHANT_KEY:-}
      PayTr__MerchantSalt: ${PAYTR_MERCHANT_SALT:-}
      PayTr__TestMode: ${PAYTR_TEST_MODE:-true}
      Frontend__BaseUrl: ${FRONTEND_BASE_URL:-https://app.kolaykobi.com}
    # Backend'i dışarıya açmıyoruz — nginx iç ağdan proxy yapıyor
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: kkb-frontend
    restart: unless-stopped
    # Frontend'i dışarıya açmıyoruz — nginx proxy yapıyor
    expose:
      - "80"

  # Veo kliplerini birleştirir ve son kareyi çıkarır.
  #
  # NEDEN: Veo dikey videoda `extend` desteklemiyor (API doğrudan
  # "Aspect ratio of the input video must be 16:9" diyor). Çok sahneli video
  # ancak ayrı klipler üretip birleştirilerek elde ediliyor — ve bu montaj
  # kullanıcıya bırakılamaz.
  #
  # Dışarıya AÇILMIYOR: Traefik etiketi ve yayınlanmış port yok. n8n aynı
  # ağdan (n8n_default) `http://kkb-medya:8080` ile erişiyor; son videoyu
  # kullanıcıya nginx `/medya/` altından veriyor.
  medya:
    build:
      context: ./medya
      dockerfile: Dockerfile
    container_name: kkb-medya
    restart: unless-stopped
    environment:
      # Veo dosyaları indirilirken gerekiyor. Anahtar istek gövdesinde
      # taşınmasın diye servisin kendi ortamından okunuyor.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # 30 gün. Kullanıcı videoyu üretip sekmeyi kapatırsa Geçmiş Çıktılar'dan
      # geri dönebilmeli. Süre uzadığı için depoya ayrıca bayt tavanı konuldu;
      # tavan aşılırsa süresi dolmamış en eski dosyalar da silinir.
      SAKLAMA_SAATI: ${MEDYA_SAKLAMA_SAATI:-720}
      MAKS_DEPO_BAYT: ${MEDYA_MAKS_DEPO_BAYT:-5368709120}
    volumes:
      - medya_cikti:/veri/cikti
    expose:
      - "8080"
    networks:
      - default
      - traefik_net

  nginx:
    image: nginx:alpine
    container_name: kkb-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
      - medya
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # Yerel test için — Traefik dışarıdan proxy yapıyor
      - "127.0.0.1:3001:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kolaykobi.rule=Host(`app.kolaykobi.com`)"
      - "traefik.http.routers.kolaykobi.tls=true"
      - "traefik.http.routers.kolaykobi.entrypoints=websecure"
      - "traefik.http.routers.kolaykobi.tls.certresolver=letsencrypt"
      - "traefik.http.services.kolaykobi.loadbalancer.server.port=80"
      - "traefik.docker.network=n8n_default"
    networks:
      - default
      - traefik_net

volumes:
  postgres_data:
  # Birleştirilmiş videolar. Servis 48 saat sonra kendi temizliyor;
  # birim kalıcı olduğu için container yeniden oluşturulunca dosyalar kaybolmuyor.
  medya_cikti:

networks:
  traefik_net:
    external: true
    name: n8n_default
