server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html HER SEFERİNDE sunucuya sorulsun (no-cache = kullanmadan önce
    # doğrula). Başlık hiç gönderilmiyordu; tarayıcı sayfayı kendi tahminiyle
    # önbellekte tutuyor ve deploy sonrası eski paketi açıyordu — 11 Eyl 2026'da
    # yeni sektörler yayında olduğu hâlde kullanıcıda görünmedi. SPA'daki her
    # yol da buraya düştüğü için hepsi kapsanıyor.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Adında sürüm kodu olmayan, müşteri sitelerine gömülen widget: aşağıdaki
    # "1 yıl, değişmez" kuralına düşünce güncellemeler ziyaretçilere ulaşmıyordu.
    location = /chatbot-widget.js {
        add_header Cache-Control "no-cache";
    }

    # .mjs — nginx'in mime.types dosyasında bu uzantı YOK, dolayısıyla
    # application/octet-stream olarak sunuluyordu. pdf.js worker'ı modül
    # worker'ı olarak açılıyor (new Worker(url, {type:'module'})) ve tarayıcı
    # modül worker'larında MIME tipini KATI denetler: JavaScript tipi değilse
    # worker hiç başlamıyor. pdf.js 6'da ana iş parçacığına düşen yedek yol da
    # kaldırıldığı için sessiz kurtarma yok — PDF yükleyen kullanıcı yalnızca
    # "Dosya okunamadı. Dosyanın bozuk olmadığından emin olun." görüyordu
    # (24 Eyl 2026'da bildirildi). TXT yükleme etkilenmiyordu, çünkü o yol
    # worker kullanmıyor.
    #
    # `types` yalnızca bu location içinde tanımlı: nginx, iç bağlamda
    # tanımlanan types bloğunun ÜST TABLONUN TAMAMININ yerine geçmesine yol
    # açar; burada yalnızca .mjs eşleştiği için diğer tipler etkilenmiyor.
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Vite paket dosyalarının adında içerik özeti (hash) var — içerik değişince
    # ad da değişiyor, bu yüzden 1 yıl güvenle önbellekte kalabilirler.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
