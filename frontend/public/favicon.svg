<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- White background -->
  <rect width="64" height="64" rx="12" fill="white"/>

  <!-- Navy blue circle ring (KolayKOBİ çember) -->
  <circle cx="32" cy="28" r="20" fill="none" stroke="#1D2D7A" stroke-width="3.5"/>

  <!-- Orange scissors (makas - KolayKOBİ simgesi) -->
  <!-- Pivot noktası: (32, 29) -->

  <!-- Sol bıçak: pivot → sol-aşağı yönünde -->
  <line x1="32" y1="29" x2="18" y2="42" stroke="#E05A3A" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Sağ bıçak: pivot → sağ-aşağı yönünde -->
  <line x1="32" y1="29" x2="46" y2="42" stroke="#E05A3A" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Sol kulp halkası -->
  <circle cx="16" cy="45" r="5.5" fill="none" stroke="#E05A3A" stroke-width="2.8"/>
  <!-- Sağ kulp halkası -->
  <circle cx="48" cy="45" r="5.5" fill="none" stroke="#E05A3A" stroke-width="2.8"/>

  <!-- Pivot noktası (vida) -->
  <circle cx="32" cy="29" r="2" fill="#E05A3A"/>
</svg>
