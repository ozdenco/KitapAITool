# docker-compose.dev.yml — Yerel geliştirme override'ı
#
# Kullanım:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   (ardından: cd backend && dotnet run  --  ayrı terminalde)
#
# Bu dosya:
#   - postgres'i dışarıya açar (dotnet run Mac'te çalıştığından localhost:5432 gerekli)
#   - backend container'ını busybox stub ile değiştirir (nginx depends_on'u tatmin eder)
#   - nginx'i dev konfig ile başlatır → host.docker.internal:5000'e proxy (Mac host .NET)

services:
  postgres:
    ports:
      - "5432:5432"

  backend:
    # Stub: gerçek backend yerine anında çıkan minimal container
    # nginx'in depends_on:backend şartını karşılar
    # Gerçek backend: ayrı terminalde `cd backend && dotnet run`
    image: busybox:latest
    command: ["sh", "-c", "echo 'DEV: backend Mac hostda dotnet run ile calisiyor' && sleep 1"]
    environment: []  # Ana compose'daki env'leri temizle
    expose: []
    restart: "no"

  nginx:
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started  # busybox stub başlayınca tatmin olur
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
