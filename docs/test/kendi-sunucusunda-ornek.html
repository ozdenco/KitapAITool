<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Chatbot testi</title>
</head>
<body>
  <h1>Deneme sayfası</h1>
  <p>Chatbot sağ alt köşede çıkmalı.</p>

  <!--
    KolayKOBİ chatbot — KENDİ SUNUCUNUZDA barındırma örneği.

    1. Araçtan indirdiğiniz "kolaykobi-chatbot.js" dosyasını bu HTML ile
       AYNI KLASÖRE koyun.
    2. Sayfayı bir web sunucusu üzerinden açın. Dosyaya çift tıklayarak
       (file://) açarsanız tarayıcı komşu dosyayı yüklemeyebilir.
       Hızlı yol — klasörün içinde:
           python3 -m http.server 8080
       sonra tarayıcıda:  http://localhost:8080/

    YALNIZCA BİR YÖNTEM kullanın. Bu dosyadaki satır "kendi sunucunuzda"
    biçimidir; ayrıca app.kolaykobi.com/chatbot-widget.js satırını da
    eklerseniz iki baloncuk birden çıkar.

    Yol başında "/" YOK: "/kolaykobi-chatbot.js" dosyayı sitenin KÖK
    dizininde arar. Aynı klasördeyse aşağıdaki gibi yazın.
  -->
  <script src="kolaykobi-chatbot.js"></script>
</body>
</html>
